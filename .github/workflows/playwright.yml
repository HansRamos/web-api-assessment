name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # schedule:
  #   - cron: '0 1 * * *'

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Manila

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Restore Allure history
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/cache/restore@v4
        with:
          path: allure-history.jsonl
          key: allure-history-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            allure-history-main-

      - name: Generate Allure report
        id: allure_report
        if: ${{ !cancelled() }}
        run: npx allure generate allure-results --output allure-report

      - name: Save Allure history
        if: ${{ !cancelled() && steps.allure_report.outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v4
        with:
          path: allure-history.jsonl
          key: allure-history-main-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Allure report
        if: ${{ !cancelled() && steps.allure_report.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}-${{ github.run_attempt }}
          path: allure-report/
          retention-days: 30

      - name: Deploy Allure report to Cloudflare
        if: ${{ !cancelled() && steps.allure_report.outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy allure-report --project-name=web-api-test-report --branch=main